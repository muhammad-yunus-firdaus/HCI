<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="transition-colors duration-500 overflow-hidden">
    <div id="progress-line" class="fixed top-0 left-0 h-0.5 bg-black dark:bg-white z-[70] transition-all duration-500"
        style="width: 0%"></div>

    <div id="sidebar-backdrop" class="md:hidden fixed inset-0 bg-black/50 z-[75]"></div>
    <div class="flex h-full w-full bg-[#f5f5f7] dark:bg-[#050505]">

        <aside id="sidebar-progress"
            class="hidden md:flex flex-col w-72 h-full border-r border-gray-200 dark:border-transparent bg-[#ededf2]/80 dark:bg-[#111] px-4 py-6 z-40 relative shrink-0 no-scrollbar">
            <div class="mb-8 flex items-center gap-4 px-2 h-10 shrink-0">
                <button onclick="toggleSidebar()"
                    class="p-2 hover:bg-gray-200 dark:hover:bg-[#222] rounded-xl transition-colors shrink-0">
                    <i data-lucide="menu" class="w-5 h-5 text-gray-600 dark:text-gray-300"></i>
                </button>
                <h2 class="text-[15px] font-bold text-gray-900 dark:text-white truncate">Progres</h2>
            </div>

            <div class="flex-1 overflow-y-auto pr-2 pb-8 space-y-2 no-scrollbar" id="sidebar-steps-container">
            </div>
        </aside>

        <div class="flex-1 flex flex-col relative h-full min-w-0">
            <header id="main-nav"
                class="w-full px-8 py-4 flex justify-between items-center transition-all duration-300 bg-[#f5f5f7] dark:bg-[#050505] border-b border-gray-200/60 dark:border-[#1c1c1c]/60 shrink-0">
                <div class="flex items-center gap-4">

                    <button onclick="toggleSidebar()"
                        class="w-9 h-9 rounded-xl hover:bg-gray-100 dark:hover:bg-[#111] flex items-center justify-center text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all">
                        <span id="sidebar-toggle-icon" class="w-5 h-5 flex items-center justify-center"></span>
                    </button>

                    <div class="w-9 h-9 rounded-full border border-gray-200 dark:border-[#222] bg-white dark:bg-[#0a0a0a] flex items-center justify-center shadow-sm"
                        id="stage-icon-container">
                        <i data-lucide="graduation-cap" class="w-4 h-4 text-gray-600 dark:text-gray-400"></i>
                    </div>

                    <div class="flex flex-col justify-center">
                        <h1 class="text-[15px] font-bold text-gray-900 dark:text-white transition-colors leading-none tracking-tight"
                            id="stage-title">Kebijakan Privasi</h1>
                    </div>
                </div>

                <button id="theme-toggle"
                    class="w-9 h-9 rounded-full border border-gray-200 dark:border-[#222] bg-white dark:bg-[#0a0a0a] flex items-center justify-center text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-[#111] transition-all shadow-sm focus:outline-none group">
                    <i data-lucide="moon" id="theme-icon"
                        class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                </button>
            </header>

            <main id="app-container"
                class="flex-1 overflow-y-auto w-full custom-scrollbar px-4 lg:px-8 pt-10 pb-32 flex flex-col items-center relative">
                <div id="loading" class="mt-20 text-center text-sm font-medium text-gray-500">Mempersiapkan...</div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
